    language_mode: "bn-IN"
    audio: "test_data/audio/clip_bn_004.wav"
    ground_truth: "দাদু এখন ভালো আছে। খিচুড়ি খেয়ে নিল। কাল সকালে ডক্টর সেনের কাছে নিয়ে যাব। তোমরা সবাই ঘুমাও। কালকে দেখা যাবে।"
    duration_s: 8.19

