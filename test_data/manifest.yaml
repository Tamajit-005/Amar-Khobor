clips:
  - id: "bn_001"
    language_mode: "bn-IN"
    audio: "test_data/audio/clip_bn_001.wav"
    ground_truth: "আর ভাবছি এখন থেকেই প্ল্যান করা উচিত কোথায় ঘুরবো, কত টাকা খরচ হবে আর কে কে যাচ্ছে। আমি তো ভাবলাম শান্তিনিকেতনে একটা ভালো লজে থাকবো আর ওখানে সোনাঝুরির হাটে হাটও দেখে আসতে পারি। তোমরা ভেবে দেখো ভালো অপশন আছে নাকি।"
    duration_s: 17.93

  - id: "bn_002"
    language_mode: "bn-IN"
    audio: "test_data/audio/clip_bn_002.wav"
    ground_truth: "ঠিক আছে, দুহাজার করে খরচ করলে ভালো। কিন্তু সোনাঝুরির হাটে যদি বেশি কেনাকাটা হয়, ওখানে বেশি খরচ করবো না। এবার তোমরা সেটা বুঝে নিও।"
    duration_s: 8.71

  - id: "bn_003"
    language_mode: "bn-IN"
    audio: "test_data/audio/clip_bn_003.wav"
    ground_truth: "আমি ভেবেছিলাম হার্টের সমস্যা, কিন্তু দাদু বলল গ্যাসের সমস্যা। এদেকাত, তুমি এখনই যাও দাদুকে দেখে আসো। আর বাকিরা প্লিজ টেনশন করো না, আমিও এখনই যাচ্ছি।"
    duration_s: 10.29

